<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ardy's Bowl</title>
  <meta name="description" content="Has Ardy been fed? Shared breakfast and dinner tracker for the family.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ardy's Bowl">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/ardy-hungry.jpg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" as="image" href="images/ardy-hungry.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="today">Today</p>
        <h1>Ardy</h1>
      </div>
      <button class="me" id="meBtn" type="button" aria-label="Switch person"></button>
    </header>

    <!-- Hero: Ardy's photo changes with his state (waiting / fed / resting) -->
    <section class="hero" id="hero" data-state="loading" aria-live="polite">
      <img class="hero-img" id="heroImg" src="images/ardy-hungry.jpg" alt="Ardy looking up at the camera">
      <div class="hero-shade"></div>
      <div class="hero-body">
        <p class="hero-kicker" id="heroKicker">Checking the bowl…</p>
        <h2 class="hero-title" id="heroTitle">One moment</h2>
        <div class="hero-foot">
          <button class="cta" id="cta" type="button" hidden>
            <span class="cta-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg>
            </span>
            <span id="ctaLabel">I fed Ardy</span>
          </button>
          <div class="fedby" id="fedBy" hidden>
            <span class="avatar sm" id="fedByAvatar"></span>
            <span id="fedByText"></span>
            <button class="link" id="fedByUndo" type="button">Undo</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Week -->
    <section class="week">
      <div class="week-head">
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 44 44"><circle class="ring-track" cx="22" cy="22" r="18"/><circle class="ring-fill" id="ringFill" cx="22" cy="22" r="18"/></svg>
        </div>
        <div class="week-title">
          <h3 id="weekLabel">This week</h3>
          <p id="weekSummary">0 of 14 meals</p>
        </div>
        <div class="week-nav">
          <button class="nav" id="prev" type="button" aria-label="Previous week"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
          <button class="nav" id="next" type="button" aria-label="Next week"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
      </div>

      <div class="list" role="table" aria-label="Meals this week">
        <div class="list-head" role="row">
          <span role="columnheader"></span>
          <span role="columnheader" class="col">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            Breakfast
          </span>
          <span role="columnheader" class="col">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
            Dinner
          </span>
        </div>
        <div id="days"></div>
      </div>
      <button class="back-today" id="toToday" type="button" hidden>Back to this week</button>
    </section>

    <p class="footnote" id="note"><span class="dot" id="syncDot"></span><span id="syncText">Connecting…</span></p>
  </main>

  <!-- Who's feeding -->
  <dialog id="whoDialog" aria-labelledby="whoTitle">
    <form id="whoForm" method="dialog">
      <div class="grabber" aria-hidden="true"></div>
      <h3 id="whoTitle" tabindex="-1" autofocus>Who's feeding Ardy?</h3>
      <p class="sub">Your name shows on the meals you tick off. You only pick once on this phone.</p>
      <div class="people" id="people"></div>
      <div class="other" id="otherRow" hidden>
        <label for="otherName">Your name</label>
        <div class="other-field">
          <input id="otherName" type="text" maxlength="40" autocomplete="given-name" placeholder="Your name">
          <button class="pill" id="otherSave" type="submit">Done</button>
        </div>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undo" type="button">Undo</button></div>

  <script type="module" src="app.js"></script>
</body>
</html>
